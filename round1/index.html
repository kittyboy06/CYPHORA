<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHORA | Stage 1: OS Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Fira+Code:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080c06;
      color: #eae0c8;
      font-family: 'Fira Code', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(ellipse at center, rgba(223, 177, 37, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(10, 14, 8, 0.95), rgba(10, 14, 8, 0.95)),
        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    .terminal-window {
      background: rgba(14, 18, 12, 0.95);
      border: 1px solid #735a11;
      border-top: 2px solid #dfb125;
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(223, 177, 37, 0.15);
      width: 100%;
      max-width: 720px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .terminal-bar {
      background: rgba(22, 28, 18, 0.9);
      padding: 0.75rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(223, 177, 37, 0.2);
    }
    .terminal-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #dfb125;
      font-weight: 700;
    }
    .window-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
    }
    .dot-red { background: #e06c75; }
    .dot-yellow { background: #e5c07b; }
    .dot-green { background: #98c379; }
    .terminal-body {
      padding: 2rem;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #98c379;
    }
    .highlight {
      color: #dfb125;
      font-weight: 600;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #dfb125;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .action-panel {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.2rem;
      border: 1px solid rgba(223, 177, 37, 0.4);
      background: rgba(223, 177, 37, 0.1);
      color: #dfb125;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 3px;
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: #dfb125;
      color: #0a0e08;
      box-shadow: 0 0 15px rgba(223, 177, 37, 0.4);
    }
  </style>
</head>
<body>
  <div class="terminal-window">
    <div class="terminal-bar">
      <div class="terminal-title">CYPHORA // STAGE 1: OS NAVIGATION</div>
      <div class="window-dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
    </div>
    <div class="terminal-body">
      <p>[SYSTEM] Initializing OS Navigation Environment...</p>
      <p>[SYSTEM] Booting simulated workstation interface.</p>
      <p>[AUTH] Explorer credentials validated: <span class="highlight" id="teamDisplay">Explorer</span></p>
      <p>[STATUS] Stage 1 tasks unlocked. Ready for instructions.</p>
      <br>
      <p>> Navigation module online. <span class="cursor"></span></p>
      
      <div class="action-panel">
        <a href="/" class="back-btn">&larr; Return to Expedition</a>
      </div>
    </div>
  </div>

  <script>
    const team = localStorage.getItem('cyphora_team_name') || 'Explorer';
    document.getElementById('teamDisplay').innerText = team;
  </script>
</body>
</html>
